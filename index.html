<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>水滴 — Y軸</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; -webkit-user-select:none; }
body { background:#0c0c0c; height:100dvh; overflow:hidden; }
canvas { display:block; width:100%; height:100dvh; }
#hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
       padding:20px 22px 0; pointer-events:none; z-index:5; }
.hl { font-size:9px; letter-spacing:4px; text-transform:uppercase; color:rgba(255,255,255,0.18);
      font-family:-apple-system,sans-serif; }
.hc { font-size:8px; letter-spacing:2px; color:rgba(255,255,255,0.09);
      font-family:-apple-system,sans-serif; }
#over { position:fixed; inset:0; background:#0c0c0c; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:28px; z-index:100; }
.ot { font-size:10px; letter-spacing:8px; color:rgba(255,255,255,0.45); text-transform:uppercase;
      font-family:-apple-system,sans-serif; }
.od { font-size:11px; color:rgba(255,255,255,0.25); text-align:center; line-height:2.6;
      font-family:-apple-system,sans-serif; }
.obs { font-family:-apple-system,sans-serif; font-size:10px; letter-spacing:5px; text-transform:uppercase;
       background:transparent; color:rgba(255,255,255,0.35);
       border:1px solid rgba(255,255,255,0.15); padding:14px 40px; cursor:pointer; }
</style>
</head>
<body>
<div id="hud">
  <span class="hl">← 傾ける</span>
  <span class="hc">水滴 · Y軸</span>
  <span class="hl">傾ける →</span>
</div>
<canvas id="c"></canvas>
<div id="over">
  <div class="ot">水滴 — Y軸</div>
  <div class="od">水滴は画面中央に固定されています<br>左右に傾けて通り過ぎると<br>吸い付いてポヨンと弾みます</div>
  <button class="obs" id="sb">Start</button>
</div>
<script>
'use strict';
const C=document.getElementById('c');
const X=C.getContext('2d');
function resize(){C.width=window.innerWidth; C.height=window.innerHeight;}
resize(); window.addEventListener('resize',resize);

let rawGamma=0, prevGamma=0, dGamma=0, lastDir=1;
let hasG=false, playing=false;

// Camera pan: drop fixed in world, screen pans with tilt
const PAN = () => C.width / 55;

// ── Stretch spring ────────────────────────────────────────
let stretch  = 0;   // + = right elongation, - = left elongation
let stretchV = 0;

let wasInContact = false;

const CONTACT_DEG  = 14;
const SPRING_K     = 20;
const SPRING_DAMP  = 0.68;  // underdamped = good poyong bounce
const IMPULSE_MAX  = 6.5;

let lt=0;
function loop(ts){
  if(!playing) return;
  const dt=Math.min((ts-lt)/1000,0.05); lt=ts;

  dGamma=(rawGamma-prevGamma)/Math.max(dt,0.001);
  prevGamma=rawGamma;
  if(Math.abs(rawGamma)>3) lastDir=Math.sign(rawGamma);

  const inContact = Math.abs(rawGamma) < CONTACT_DEG;

  if(inContact && !wasInContact){
    const speed=Math.min(Math.abs(dGamma),100)/100;
    const dir  =Math.sign(dGamma)||lastDir;
    stretchV  +=dir*(0.4+speed*0.6)*IMPULSE_MAX;
  }
  wasInContact=inContact;

  stretchV-=stretch*SPRING_K*dt;
  stretchV*=Math.pow(SPRING_DAMP,dt*60);
  stretch +=stretchV*dt;

  draw();
  requestAnimationFrame(loop);
}

function draw(){
  const W=C.width, H=C.height;
  X.fillStyle='#0c0c0c'; X.fillRect(0,0,W,H);

  // Drop screen position via camera pan
  const dx=W/2 - rawGamma*PAN();
  const dy=H/2;
  // 2× bigger
  const R =Math.min(W,H)*0.184;

  const absS=Math.abs(stretch);
  // Whole drop stretches dramatically — no separate thread/satellite
  const rX = R * (1 + absS * 1.55);   // strong horizontal elongation
  const rY = R * (1 / (1 + absS * 0.60));  // volume-conservation vertical squish

  // Drop shadow
  X.save();
  X.translate(dx, dy+rY*0.88);
  X.scale(rX*0.85, rY*0.15);
  X.beginPath(); X.arc(0,0,1,0,Math.PI*2);
  X.fillStyle='rgba(255,255,255,0.07)'; X.fill();
  X.restore();

  // ── Main drop body (ellipse, gradient defined in local space) ──
  X.save();
  X.translate(dx,dy);
  X.scale(rX/R, rY/R);

  // Clip to ellipse
  X.beginPath(); X.arc(0,0,R,0,Math.PI*2); X.clip();

  // Gradient in local (scaled) coords — highlight stays proportional
  const grd=X.createRadialGradient(-R*0.25,-R*0.28,R*0.04, 0,0,R*1.05);
  grd.addColorStop(0,  'rgba(255,255,255,0.96)');
  grd.addColorStop(0.30,'rgba(175,175,175,0.90)');
  grd.addColorStop(0.65,'rgba(90,90,90,0.85)');
  grd.addColorStop(1,  'rgba(28,28,28,0.88)');

  X.fillStyle=grd;
  X.fillRect(-rX,-rY, rX*2, rY*2);  // fill within clip
  X.restore();

  // ── Edge highlight ring (gives glassy depth) ────────────
  X.save();
  X.translate(dx,dy);
  X.scale(rX/R, rY/R);
  X.beginPath(); X.arc(0,0,R,0,Math.PI*2);
  X.strokeStyle=`rgba(255,255,255,${(0.15+absS*0.08).toFixed(3)})`;
  X.lineWidth=2;
  X.stroke();
  X.restore();

  // ── Specular highlights (in screen space, move with stretch) ──
  // Primary: top-left of the drop
  const hlx=dx-rX*0.25, hly=dy-rY*0.30;
  const hlR=R*0.16;
  X.beginPath(); X.arc(hlx,hly,hlR,0,Math.PI*2);
  X.fillStyle='rgba(255,255,255,0.80)'; X.fill();

  // Secondary smaller
  X.beginPath(); X.arc(dx-rX*0.10, dy-rY*0.52, R*0.072, 0, Math.PI*2);
  X.fillStyle='rgba(255,255,255,0.45)'; X.fill();
}

window.addEventListener('deviceorientation',e=>{hasG=true; rawGamma=e.gamma||0;},true);

const K={};
window.addEventListener('keydown',e=>{K[e.key]=true;});
window.addEventListener('keyup',  e=>{K[e.key]=false;});
let kGamma=0;
setInterval(()=>{
  if(hasG) return;
  const s=2.5;
  if     (K['ArrowLeft'] ||K['a']) kGamma=Math.max(-90,kGamma-s);
  else if(K['ArrowRight']||K['d']) kGamma=Math.min( 90,kGamma+s);
  else kGamma*=0.84;
  rawGamma=kGamma;
},16);

document.getElementById('sb').addEventListener('click',async function(){
  if(typeof DeviceOrientationEvent!=='undefined'&&
     typeof DeviceOrientationEvent.requestPermission==='function'){
    try{const r=await DeviceOrientationEvent.requestPermission();
        if(r==='granted') window.addEventListener('deviceorientation',e=>{hasG=true;rawGamma=e.gamma||0;},true);
    }catch(e){}
  }
  document.getElementById('over').style.display='none';
  stretch=0; stretchV=0; wasInContact=false; prevGamma=rawGamma; lastDir=1;
  playing=true; lt=performance.now(); requestAnimationFrame(loop);
});
</script>
</body>
</html>
