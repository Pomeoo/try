<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Surface Haptics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;}
#label{
  position:fixed;top:calc(20px + env(safe-area-inset-top));
  left:0;right:0;text-align:center;
  font-size:13px;color:rgba(255,255,255,0.35);
  font-family:-apple-system,sans-serif;letter-spacing:0.08em;
  pointer-events:none;
}
.tabs{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;gap:8px;
  padding:12px 16px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(0,0,0,0.8));
}
.tab{
  flex:1;padding:11px 4px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.18);
  background:transparent;
  color:rgba(255,255,255,0.32);
  font-size:11px;cursor:pointer;
  font-family:-apple-system,sans-serif;
  transition:all 0.15s;line-height:1.3;
}
.tab.active{
  background:rgba(255,255,255,0.1);
  color:#fff;
  border-color:rgba(255,255,255,0.5);
}
#perm{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  padding:16px 32px;
  border:1px solid rgba(255,255,255,0.4);
  background:transparent;color:#fff;
  font-size:15px;border-radius:100px;
  font-family:-apple-system,sans-serif;
  cursor:pointer;display:none;
  letter-spacing:0.02em;
}
#perm-hint{
  position:fixed;top:calc(50% + 52px);left:0;right:0;
  text-align:center;font-size:11px;
  color:rgba(255,255,255,0.25);
  font-family:-apple-system,sans-serif;
  display:none;
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="label">乾いた板</div>
<div class="tabs">
  <button class="tab active" data-s="dry">乾いた板</button>
  <button class="tab" data-s="wet">濡れた板</button>
  <button class="tab" data-s="rough">ざらざら</button>
  <button class="tab" data-s="sticky">粘着</button>
</div>
<button id="perm">センサーを有効にする</button>
<p id="perm-hint">タップして傾きセンサーを許可</p>

<script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

const NAMES={dry:'乾いた板',wet:'濡れた板',rough:'ざらざら',sticky:'粘着'};
const S={
  dry: {fr:0.984,grav:0.42,tLen:10,tStyle:'line',tA:0.11,shDx:3,shDy:4,shA:0.6,shBlur:false,vib:0,deform:0,sticky:0},
  wet: {fr:0.9978,grav:0.44,tLen:55,tStyle:'line',tA:0.05,shDx:1,shDy:2,shA:0.2,shBlur:true,vib:0,deform:0,sticky:0},
  rough:{fr:0.956,grav:0.38,tLen:22,tStyle:'dot',tA:0.22,shDx:4,shDy:5,shA:0.7,shBlur:false,vib:1.6,deform:0.09,sticky:0},
  sticky:{fr:0.895,grav:0.30,tLen:65,tStyle:'thick',tA:0.10,shDx:1,shDy:1,shA:0.18,shBlur:false,vib:0,deform:0.28,sticky:0.14}
};

let cur='dry',s=S.dry;
let ball={x:0,y:0,vx:0,vy:0};
let tilt={x:0,y:0};
let trail=[];
let hasOri=false;

function initBall(){ball.x=W/2;ball.y=H/2;ball.vx=0;ball.vy=0;trail=[];}
initBall();

document.querySelectorAll('.tab').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    cur=b.dataset.s;s=S[cur];
    trail=[];ball.vx=0;ball.vy=0;
    document.getElementById('label').textContent=NAMES[cur];
  });
});

function onOri(e){
  if(e.gamma===null)return;
  hasOri=true;
  tilt.x=Math.max(-1,Math.min(1,e.gamma/22));
  tilt.y=Math.max(-1,Math.min(1,(e.beta-30)/22));
}

function setupOri(){window.addEventListener('deviceorientation',onOri);}

const permBtn=document.getElementById('perm');
const permHint=document.getElementById('perm-hint');

if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
  permBtn.style.display='block';
  permHint.style.display='block';
  permBtn.addEventListener('click',async()=>{
    try{
      const r=await DeviceOrientationEvent.requestPermission();
      if(r==='granted'){setupOri();permBtn.style.display='none';permHint.style.display='none';}
    }catch(e){permBtn.textContent='再度タップ';}
  });
}else{
  setupOri();
}

function update(){
  const R=Math.min(W,H)*0.053;
  let ax=tilt.x*s.grav;
  let ay=tilt.y*s.grav;
  const spd=Math.sqrt(ball.vx**2+ball.vy**2);

  if(s.vib>0&&spd>0.1){
    ax+=(Math.random()-0.5)*s.vib;
    ay+=(Math.random()-0.5)*s.vib;
  }
  if(s.sticky>0){
    const f=Math.sqrt(ax**2+ay**2);
    if(spd<0.4&&f<s.sticky){ax*=0.03;ay*=0.03;}
  }

  ball.vx=(ball.vx+ax)*s.fr;
  ball.vy=(ball.vy+ay)*s.fr;
  ball.x+=ball.vx;
  ball.y+=ball.vy;

  const m=R+2;
  if(ball.x<m){ball.x=m;ball.vx*=-0.28;}
  if(ball.x>W-m){ball.x=W-m;ball.vx*=-0.28;}
  if(ball.y<m){ball.y=m;ball.vy*=-0.28;}
  if(ball.y>H-m){ball.y=H-m;ball.vy*=-0.28;}

  trail.push({x:ball.x,y:ball.y});
  if(trail.length>s.tLen)trail.shift();
}

function render(){
  const R=Math.min(W,H)*0.053;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);

  const n=trail.length;
  if(n>1){
    if(s.tStyle==='dot'){
      trail.forEach((p,i)=>{
        if(i%3!==0)return;
        ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);
        ctx.fillStyle=`rgba(255,255,255,${(i/n)*s.tA*2.5})`;ctx.fill();
      });
    }else if(s.tStyle==='thick'){
      for(let i=1;i<n;i++){
        const prog=i/n;
        ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);
        ctx.strokeStyle=`rgba(255,255,255,${prog*s.tA*1.5})`;
        ctx.lineWidth=prog*R*0.72+0.5;ctx.lineCap='round';ctx.stroke();
      }
    }else{
      for(let i=1;i<n;i++){
        ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);
        ctx.strokeStyle=`rgba(255,255,255,${(i/n)*s.tA})`;
        ctx.lineWidth=1.5;ctx.lineCap='round';ctx.stroke();
      }
    }
  }

  // Shadow
  if(s.shBlur){
    ctx.save();ctx.filter='blur(10px)';
    ctx.beginPath();ctx.arc(ball.x+s.shDx,ball.y+s.shDy,R*0.9,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,0.08)`;ctx.fill();
    ctx.restore();
  }else{
    ctx.beginPath();ctx.arc(ball.x+s.shDx,ball.y+s.shDy,R*0.88,0,Math.PI*2);
    ctx.fillStyle=`rgba(0,0,0,${s.shA})`;ctx.fill();
  }

  // Ball
  const spd=Math.sqrt(ball.vx**2+ball.vy**2);
  ctx.save();ctx.translate(ball.x,ball.y);
  if(s.deform>0&&spd>1){
    const str=1+spd*s.deform*0.055;
    const sqz=1/Math.sqrt(str);
    ctx.rotate(Math.atan2(ball.vy,ball.vx));
    ctx.scale(str,sqz);
  }

  const gr=ctx.createRadialGradient(-R*0.22,-R*0.28,1,0,0,R);
  gr.addColorStop(0,'#ffffff');
  gr.addColorStop(1,'#787878');
  ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);
  ctx.fillStyle=gr;ctx.fill();

  ctx.beginPath();ctx.arc(-R*0.26,-R*0.3,R*0.19,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.45)';ctx.fill();
  ctx.restore();
}

(function loop(){update();render();requestAnimationFrame(loop);})();
</script>
</body>
</html>
