<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>鉛筆</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;background:#e8e4de}
canvas{position:fixed;inset:0;width:100%;height:100%}
#cv-draw{z-index:1}
#cv-pen {z-index:2}
#lbl{
  position:fixed;z-index:10;
  top:calc(24px + env(safe-area-inset-top));
  left:0;right:0;text-align:center;
  font:11px -apple-system,sans-serif;
  color:rgba(60,55,50,.40);
  letter-spacing:.12em;pointer-events:none;
}
.ui{
  position:fixed;z-index:10;
  bottom:0;left:0;right:0;
  padding:10px 12px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(30,26,22,.88) 40%);
}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{
  padding:10px 4px;border-radius:10px;
  border:1px solid rgba(255,255,255,.12);
  background:transparent;color:rgba(255,255,255,.28);
  font:11px -apple-system,sans-serif;cursor:pointer;transition:all .15s;
}
.tab.active{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.45)}
#perm{
  position:fixed;z-index:10;top:50%;left:50%;
  transform:translate(-50%,-50%);
  padding:16px 32px;
  border:1px solid rgba(60,55,50,.5);
  background:rgba(232,228,222,.92);color:#333;
  font:15px -apple-system,sans-serif;
  border-radius:100px;cursor:pointer;display:none;
}
#perm-sub{
  position:fixed;z-index:10;top:calc(50% + 54px);
  left:0;right:0;text-align:center;
  font:11px -apple-system,sans-serif;
  color:rgba(60,55,50,.38);display:none;
}
</style>
</head>
<body>

<!-- Layer 1: persistent pencil marks -->
<canvas id="cv-draw"></canvas>
<!-- Layer 2: live pencil visual + dry trail -->
<canvas id="cv-pen"></canvas>

<div id="lbl">なめらか</div>
<div class="ui">
  <div class="tabs">
    <button class="tab active" data-s="clean">なめらか</button>
    <button class="tab"        data-s="bleed">にじみ</button>
    <button class="tab"        data-s="dry">かわく</button>
    <button class="tab"        data-s="rough">かすれ</button>
  </div>
</div>
<button id="perm">センサーを有効にする</button>
<p id="perm-sub">タップして傾きセンサーを許可</p>

<script>
// ── Canvas setup ─────────────────────────────────────────────────
const cvD = document.getElementById('cv-draw');
const ctxD = cvD.getContext('2d');
const cvP = document.getElementById('cv-pen');
const ctxP = cvP.getContext('2d');

const BG = '#e8e4de'; // warm paper color
let W, H;

function resize(){
  W = cvD.width = cvP.width = window.innerWidth;
  H = cvD.height = cvP.height = window.innerHeight;
  // Refill drawing layer background
  ctxD.fillStyle = BG;
  ctxD.fillRect(0, 0, W, H);
}
resize();
window.addEventListener('resize', () => { resize(); resetPen(); });

// ── Surface configs (pencil physics on different paper) ───────────
// fr = friction, gv = gravity scale, vb = vibration (rough)
const CFG = {
  clean: { name:'なめらか', fr:0.962, gv:0.38, vb:0   },
  bleed: { name:'にじみ',   fr:0.958, gv:0.34, vb:0   },
  dry:   { name:'かわく',   fr:0.962, gv:0.38, vb:0   },
  rough: { name:'かすれ',   fr:0.950, gv:0.32, vb:0.6 }
};
let cur = 'clean', c = CFG.clean;

// ── Pen state ────────────────────────────────────────────────────
let bx, by, bvx, bvy;
let prevX = null, prevY = null; // last drawn position (permanent layer)
let dryTrail = [];              // time-based trail for 'dry' only
let tiltX = 0, tiltY = 0;

// Physical scale: iPhone screen ≈ 68mm wide
// 1 CSS pixel ≈ 68/390 mm ≈ 0.174 mm
// → 1mm ≈ 5.74 px  (used for realistic pencil size)
function mmPx(){ return W / 68; }

function resetPen(){
  bx = W/2; by = H/2; bvx = 0; bvy = 0;
  prevX = null; prevY = null;
  dryTrail = [];
}
resetPen();

// ── Surface switch ───────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    cur = b.dataset.s; c = CFG[cur];
    document.getElementById('lbl').textContent = c.name;
    // Clear drawing layer, reset pen
    ctxD.fillStyle = BG;
    ctxD.fillRect(0, 0, W, H);
    resetPen();
  });
});

// ── Sensor ───────────────────────────────────────────────────────
function onOri(e){
  if (e.gamma == null) return;
  tiltX = Math.max(-1, Math.min(1, e.gamma       / 22));
  tiltY = Math.max(-1, Math.min(1, (e.beta - 30) / 22));
}
function setupOri(){ window.addEventListener('deviceorientation', onOri); }

const pb = document.getElementById('perm');
const ps = document.getElementById('perm-sub');
if (typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission === 'function'){
  pb.style.display = 'block'; ps.style.display = 'block';
  pb.addEventListener('click', async () => {
    try {
      if (await DeviceOrientationEvent.requestPermission() === 'granted'){
        setupOri(); pb.style.display='none'; ps.style.display='none';
      }
    } catch(e){ pb.textContent='再度タップ'; }
  });
} else { setupOri(); }

// ── Physics ──────────────────────────────────────────────────────
function physics(dtMs){
  const n = dtMs / 16.67;
  let ax = tiltX * c.gv;
  let ay = tiltY * c.gv;
  if (c.vb > 0 && Math.sqrt(bvx*bvx+bvy*bvy) > 0.1){
    ax += (Math.random()-.5) * c.vb;
    ay += (Math.random()-.5) * c.vb;
  }
  const fr = Math.pow(c.fr, n);
  bvx = (bvx + ax * n) * fr;
  bvy = (bvy + ay * n) * fr;
  bx += bvx * n;
  by += bvy * n;

  // Hard boundary — pen stays on paper
  const m = 2;
  if (bx < m){ bx = m; bvx = 0; }
  if (bx > W-m){ bx = W-m; bvx = 0; }
  if (by < m){ by = m; bvy = 0; }
  if (by > H-m){ by = H-m; bvy = 0; }
}

// ── Draw stroke to persistent layer ─────────────────────────────
function drawStroke(x0, y0, x1, y1){
  ctxD.save();
  ctxD.lineCap = 'round';
  ctxD.lineJoin = 'round';

  if (cur === 'clean'){
    ctxD.beginPath(); ctxD.moveTo(x0,y0); ctxD.lineTo(x1,y1);
    ctxD.lineWidth = 1.8;
    ctxD.strokeStyle = 'rgba(38,35,30,0.78)';
    ctxD.stroke();
  }
  else if (cur === 'bleed'){
    ctxD.beginPath(); ctxD.moveTo(x0,y0); ctxD.lineTo(x1,y1);
    // Soft outer spread (ink bleeding into paper fibres)
    ctxD.lineWidth = 7;
    ctxD.strokeStyle = 'rgba(38,35,30,0.07)';
    ctxD.stroke();
    // Core graphite line
    ctxD.lineWidth = 2;
    ctxD.strokeStyle = 'rgba(38,35,30,0.72)';
    ctxD.stroke();
  }
  else if (cur === 'rough'){
    if (Math.random() < 0.24) { ctxD.restore(); return; } // skip ~24%
    ctxD.beginPath(); ctxD.moveTo(x0,y0); ctxD.lineTo(x1,y1);
    ctxD.lineWidth = 1.0 + Math.random() * 2.2;
    ctxD.strokeStyle = `rgba(38,35,30,${0.42 + Math.random()*0.36})`;
    ctxD.stroke();
  }
  // 'dry' never draws to persistent layer — handled in dryTrail

  ctxD.restore();
}

// ── Add mark each frame ──────────────────────────────────────────
function addMark(ts){
  const moved = prevX !== null &&
    Math.sqrt((bx-prevX)**2 + (by-prevY)**2) > 2;

  if (cur === 'dry'){
    const last = dryTrail[dryTrail.length-1];
    if (!last || Math.sqrt((bx-last.x)**2+(by-last.y)**2) > 2){
      dryTrail.push({x:bx, y:by, t:ts});
      if (dryTrail.length > 600) dryTrail.shift();
      while (dryTrail.length>0 && ts-dryTrail[0].t > 2400) dryTrail.shift();
    }
  } else {
    if (prevX !== null && moved) drawStroke(prevX, prevY, bx, by);
  }

  if (moved || prevX === null){ prevX = bx; prevY = by; }
}

// ── Pencil visual ────────────────────────────────────────────────
// Pencil drawn at realistic scale: 50mm visible shaft + 8mm graphite taper
// at 55° from horizontal, tip at (bx, by), body extending lower-right

const PEN_ANGLE = 55 * Math.PI / 180;

function drawPencil(){
  const mp = mmPx(); // px per mm
  const shaftLen  = 50 * mp;  // 50mm visible = ~287px
  const shaftW    = 5.4 * mp; // 5.4mm diameter = ~31px
  const taperLen  = 7  * mp;  // 7mm graphite taper = ~40px

  ctxP.save();
  ctxP.translate(bx, by);
  ctxP.rotate(PEN_ANGLE);

  // ── Graphite taper (origin = tip contact point) ──
  const tapGrad = ctxP.createLinearGradient(0, 0, taperLen, 0);
  tapGrad.addColorStop(0,    '#141414');
  tapGrad.addColorStop(0.55, '#5c5c5c');
  tapGrad.addColorStop(1,    '#929292');
  ctxP.beginPath();
  ctxP.moveTo(0, 0);
  ctxP.lineTo(taperLen * 0.25, -shaftW * 0.14);
  ctxP.lineTo(taperLen,        -shaftW * 0.50);
  ctxP.lineTo(taperLen,         shaftW * 0.50);
  ctxP.lineTo(taperLen * 0.25,  shaftW * 0.14);
  ctxP.closePath();
  ctxP.fillStyle = tapGrad;
  ctxP.fill();

  // ── Wood shaft ──────────────────────────────────
  const woodTop = ctxP.createLinearGradient(0, -shaftW/2, 0, shaftW/2);
  woodTop.addColorStop(0,    '#f2f0ee'); // highlight edge
  woodTop.addColorStop(0.18, '#dedbd7');
  woodTop.addColorStop(0.50, '#cbc8c3');
  woodTop.addColorStop(0.82, '#b8b5af');
  woodTop.addColorStop(1,    '#a6a39d'); // shadow edge

  ctxP.beginPath();
  ctxP.rect(taperLen, -shaftW/2, shaftLen, shaftW);
  ctxP.fillStyle = woodTop;
  ctxP.fill();

  // Facet lines (simulating hexagonal pencil cross-section)
  const facetY = shaftW * 0.23;
  [[facetY, 'rgba(255,255,255,0.32)'], [-facetY, 'rgba(90,88,84,0.18)']].forEach(([y, col]) => {
    ctxP.beginPath();
    ctxP.moveTo(taperLen + shaftW * 0.3, y);
    ctxP.lineTo(taperLen + shaftLen * 0.98, y);
    ctxP.strokeStyle = col;
    ctxP.lineWidth = 0.8;
    ctxP.stroke();
  });

  // Shaft outline
  ctxP.beginPath();
  ctxP.rect(taperLen, -shaftW/2, shaftLen, shaftW);
  ctxP.strokeStyle = 'rgba(110,106,100,0.35)';
  ctxP.lineWidth = 0.6;
  ctxP.stroke();

  ctxP.restore();

  // Graphite contact dot at tip
  ctxP.save();
  ctxP.translate(bx, by);
  ctxP.beginPath();
  ctxP.arc(0, 0, 1.5, 0, Math.PI * 2);
  ctxP.fillStyle = '#0c0c0c';
  ctxP.fill();
  ctxP.restore();
}

// ── Render ───────────────────────────────────────────────────────
function draw(ts){
  // Pen canvas: clear each frame
  ctxP.clearRect(0, 0, W, H);

  // かわく trail (fades with age) drawn on pen layer
  if (cur === 'dry' && dryTrail.length > 1){
    ctxP.lineCap = 'round'; ctxP.lineJoin = 'round';
    for (let i = 1; i < dryTrail.length; i++){
      const p0 = dryTrail[i-1], p1 = dryTrail[i];
      const age = ts - p0.t;
      const a = Math.max(0, 0.80 - age / 2200);
      if (a < 0.01) continue;
      ctxP.beginPath();
      ctxP.moveTo(p0.x, p0.y); ctxP.lineTo(p1.x, p1.y);
      ctxP.lineWidth = 1.8;
      ctxP.strokeStyle = `rgba(38,35,30,${a})`;
      ctxP.stroke();
    }
  }

  drawPencil();
}

// ── Main loop ────────────────────────────────────────────────────
let prevTs = 0;
function tick(ts){
  const dtMs = prevTs ? Math.min(ts-prevTs, 50) : 16.67;
  prevTs = ts;
  physics(dtMs);
  addMark(ts);
  draw(ts);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
