<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>鉛筆 / ペン</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }

#ui {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  gap: 10px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid #e0e0e0;
  z-index: 10;
}

.tools { display: flex; gap: 6px; }

button {
  height: 32px;
  padding: 0 14px;
  border: 1px solid #ccc;
  background: #fff;
  border-radius: 16px;
  font-size: 13px;
  color: #333;
  cursor: pointer;
  font-family: -apple-system, sans-serif;
  transition: background 0.12s, color 0.12s;
}
button.active {
  background: #222;
  color: #fff;
  border-color: #222;
}
button.icon {
  padding: 0;
  width: 32px;
  font-size: 15px;
  color: #888;
  border-color: transparent;
  background: transparent;
}
button.icon:hover { background: #f0f0f0; }

#sensor-btn {
  font-size: 11px;
  padding: 0 10px;
  color: #888;
  border-color: #ddd;
}
#sensor-btn.linked {
  color: #2a9d4e;
  border-color: #2a9d4e;
  background: #f0faf4;
}

#info {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: #bbb;
  font-family: -apple-system, sans-serif;
  pointer-events: none;
  white-space: nowrap;
  transition: opacity 0.4s;
}

canvas {
  position: fixed;
  top: 48px; left: 0;
  width: 100%;
  height: calc(100% - 48px);
  touch-action: none;
  background: #fff;
  cursor: crosshair;
}
</style>
</head>
<body>

<div id="ui">
  <div class="tools">
    <button class="active" id="btn-pencil" onclick="setTool('pencil')">鉛筆</button>
    <button id="btn-pen" onclick="setTool('pen')">ペン</button>
  </div>
  <button id="sensor-btn" onclick="requestMotion()">センサー OFF</button>
  <button class="icon" onclick="clearCanvas()" title="消去">✕</button>
</div>

<canvas id="cv"></canvas>

<div id="info">スマホを左右に動かしながら描いてください</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let tool = 'pencil';
let drawing = false;
let lx = 0, ly = 0, lt = 0;
let accelX = 0, smoothX = 0;
let sensorOn = false;
let infoTimer = null;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight - 48;
  cv.width = w * dpr;
  cv.height = h * dpr;
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  ctx.scale(dpr, dpr);
}
resize();
window.addEventListener('resize', resize);

function setTool(t) {
  tool = t;
  document.getElementById('btn-pencil').className = t === 'pencil' ? 'active' : '';
  document.getElementById('btn-pen').className = t === 'pen' ? 'active' : '';
}

function clearCanvas() {
  const dpr = window.devicePixelRatio || 1;
  ctx.clearRect(0, 0, cv.width / dpr, cv.height / dpr);
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  const s = e.touches ? e.touches[0] : e;
  return {
    x: s.clientX - r.left,
    y: s.clientY - r.top
  };
}

function getStrokeProps(speed) {
  const ax = Math.abs(smoothX);

  if (tool === 'pen') {
    return {
      width: Math.max(0.8, 2.0 - speed * 0.05),
      opacity: 0.88,
      grain: false
    };
  }

  // 鉛筆: 左右加速度で傾き＝ストローク幅が変わる
  const tilt = Math.min(1, ax / 10);
  const speedFactor = Math.max(0.25, 1 - speed * 0.055);
  const width = (1.2 + tilt * 7) * speedFactor;
  const opacity = Math.min(0.75, 0.2 + speedFactor * 0.55);

  return { width: Math.max(0.4, width), opacity, grain: true, tilt, axSign: smoothX >= 0 ? 1 : -1 };
}

function drawSegment(x1, y1, x2, y2, props) {
  if (!props.grain) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = `rgba(20,15,10,${props.opacity})`;
    ctx.lineWidth = props.width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    return;
  }

  // 鉛筆: 粒状の複数スレッドで描く
  const n = Math.max(2, Math.floor(2 + props.tilt * 10));
  const angle = props.axSign * props.tilt * (Math.PI / 3) + Math.PI / 2;

  for (let i = 0; i < n; i++) {
    if (Math.random() < 0.1) continue;
    const t = (i - n / 2) * (props.width / n);
    const ox = Math.cos(angle) * t;
    const oy = Math.sin(angle) * t;
    const jx = (Math.random() - 0.5) * 0.6;
    const jy = (Math.random() - 0.5) * 0.6;
    const op = props.opacity * (0.35 + Math.random() * 0.65);

    ctx.beginPath();
    ctx.moveTo(x1 + ox + jx, y1 + oy + jy);
    ctx.lineTo(x2 + ox + jx, y2 + oy + jy);
    ctx.strokeStyle = `rgba(30,22,12,${op})`;
    ctx.lineWidth = Math.max(0.25, props.width / n * 1.4);
    ctx.lineCap = 'round';
    ctx.stroke();
  }
}

function onStart(e) {
  e.preventDefault();
  drawing = true;
  const p = getPos(e);
  lx = p.x; ly = p.y; lt = Date.now();
  hideInfo();
}

function onMove(e) {
  e.preventDefault();
  if (!drawing) return;
  const p = getPos(e);
  const now = Date.now();
  const dx = p.x - lx, dy = p.y - ly;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const speed = dist / Math.max(1, now - lt) * 10;
  drawSegment(lx, ly, p.x, p.y, getStrokeProps(speed));
  lx = p.x; ly = p.y; lt = now;
}

function onEnd() { drawing = false; }

cv.addEventListener('touchstart', onStart, { passive: false });
cv.addEventListener('touchmove', onMove, { passive: false });
cv.addEventListener('touchend', onEnd);
cv.addEventListener('mousedown', onStart);
cv.addEventListener('mousemove', onMove);
cv.addEventListener('mouseup', onEnd);
cv.addEventListener('mouseleave', onEnd);

function requestMotion() {
  const btn = document.getElementById('sensor-btn');

  const onGrant = () => {
    sensorOn = true;
    btn.textContent = 'センサー ON';
    btn.className = 'linked';

    window.addEventListener('devicemotion', e => {
      const raw = (e.acceleration && e.acceleration.x != null)
        ? e.acceleration.x
        : (e.accelerationIncludingGravity ? e.accelerationIncludingGravity.x : 0);
      accelX = raw || 0;
      smoothX = smoothX * 0.72 + accelX * 0.28;
    });
  };

  if (typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission().then(s => {
      if (s === 'granted') onGrant();
      else { btn.textContent = '許可が必要'; }
    }).catch(() => { btn.textContent = 'エラー'; });
  } else if (window.DeviceMotionEvent) {
    onGrant();
  } else {
    btn.textContent = '非対応';
  }
}

function hideInfo() {
  const el = document.getElementById('info');
  el.style.opacity = '0';
}
</script>
</body>
</html>
