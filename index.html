<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pen Haptics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#lbl{position:fixed;top:calc(28px + env(safe-area-inset-top));left:0;right:0;text-align:center;font:12px -apple-system,sans-serif;color:rgba(255,255,255,.20);letter-spacing:.12em;pointer-events:none}
.ui{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.92) 40%)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{padding:11px 4px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.28);font:11px -apple-system,sans-serif;cursor:pointer;transition:all .15s}
.tab.active{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.45)}
#perm{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:16px 32px;border:1px solid rgba(255,255,255,.38);background:transparent;color:#fff;font:15px -apple-system,sans-serif;border-radius:100px;cursor:pointer;display:none}
#perm-sub{position:fixed;top:calc(50% + 54px);left:0;right:0;text-align:center;font:11px -apple-system,sans-serif;color:rgba(255,255,255,.2);display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="lbl">なめらか</div>
<div class="ui">
  <div class="tabs">
    <button class="tab active" data-s="clean">なめらか</button>
    <button class="tab"        data-s="bleed">にじみ</button>
    <button class="tab"        data-s="dry">かわく</button>
    <button class="tab"        data-s="rough">かすれ</button>
  </div>
</div>
<button id="perm">センサーを有効にする</button>
<p id="perm-sub">タップして傾きセンサーを許可</p>

<script>
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;
function resize(){ W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
resize();
window.addEventListener('resize', () => { resize(); spawnPen(); });

// fr  = velocity multiplier (friction), gv = gravity scale, vb = vibration
const CFG = {
  clean: { name:'なめらか', fr:0.984, gv:0.42, vb:0   },
  bleed: { name:'にじみ',   fr:0.978, gv:0.38, vb:0   },
  dry:   { name:'かわく',   fr:0.984, gv:0.42, vb:0   },
  rough: { name:'かすれ',   fr:0.968, gv:0.38, vb:0.9 }
};

let cur = 'clean', c = CFG.clean;

let bx, by, bvx, bvy;
let tiltX = 0, tiltY = 0;
let trail = [];                // { x, y, t, seed }

let phase  = 'spawn';
let phaseT = 0;
let fallVx = 0, fallVy = 0;
const FALL_MS  = 420;
const SPAWN_MS = 380;
const MAX_PTS  = 360;
const DRY_MAX  = 2200;  // ms before dry lines vanish

function spawnPen(){
  bx = W/2; by = H/2; bvx = 0; bvy = 0;
  trail = [];
  phase = 'spawn'; phaseT = 0;
}
spawnPen();

function eob(t){ const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }

document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    cur = b.dataset.s; c = CFG[cur];
    document.getElementById('lbl').textContent = c.name;
    spawnPen();
  });
});

// Sensor
function onOri(e){
  if (e.gamma == null) return;
  tiltX = Math.max(-1, Math.min(1, e.gamma       / 22));
  tiltY = Math.max(-1, Math.min(1, (e.beta - 30) / 22));
}
function setupOri(){ window.addEventListener('deviceorientation', onOri); }
const pb = document.getElementById('perm');
const ps = document.getElementById('perm-sub');
if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
  pb.style.display = 'block'; ps.style.display = 'block';
  pb.addEventListener('click', async () => {
    try { if (await DeviceOrientationEvent.requestPermission() === 'granted'){ setupOri(); pb.style.display='none'; ps.style.display='none'; } }
    catch(e){ pb.textContent = '再度タップ'; }
  });
} else { setupOri(); }

// ── Physics (v4 style) ────────────────────────────────────────────
function physics(dtMs){
  const n = dtMs / 16.67;
  let ax = tiltX * c.gv;
  let ay = tiltY * c.gv;
  const spd = Math.sqrt(bvx*bvx + bvy*bvy);
  if (c.vb > 0 && spd > 0.1){
    ax += (Math.random() - 0.5) * c.vb;
    ay += (Math.random() - 0.5) * c.vb;
  }
  const fr = Math.pow(c.fr, n);
  bvx = (bvx + ax * n) * fr;
  bvy = (bvy + ay * n) * fr;
  bx += bvx * n;
  by += bvy * n;

  const R   = Math.min(W,H) * 0.03;
  const edge = R * 0.4;
  if (bx < edge || bx > W-edge || by < edge || by > H-edge){
    const dx = bx-W/2, dy = by-H/2, d = Math.sqrt(dx*dx+dy*dy)||1;
    fallVx = (dx/d) * Math.max(Math.abs(bvx), 2.5);
    fallVy = (dy/d) * Math.max(Math.abs(bvy), 2.5);
    phase = 'fall'; phaseT = 0;
  }
}

// ── Trail ─────────────────────────────────────────────────────────
function addPoint(ts){
  const last = trail[trail.length - 1];
  if (!last || Math.sqrt((bx-last.x)**2 + (by-last.y)**2) > 2.2){
    trail.push({ x:bx, y:by, t:ts, seed:Math.random() });
    if (trail.length > MAX_PTS) trail.shift();
  }
  if (cur === 'dry'){
    while (trail.length > 0 && ts - trail[0].t > DRY_MAX) trail.shift();
  }
}

function drawTrail(now, fa){ // fa = fall alpha multiplier
  if (trail.length < 2) return;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  for (let i = 1; i < trail.length; i++){
    const p0 = trail[i-1], p1 = trail[i];
    const age = now - p0.t;

    if (cur === 'clean'){
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y);
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = `rgba(255,255,255,${0.78 * fa})`;
      ctx.stroke();
    }
    else if (cur === 'bleed'){
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y);
      // Halo bleed (wide + transparent, drawn first)
      if (age > 100){
        ctx.lineWidth = Math.min(4 + age * 0.018, 34);
        ctx.strokeStyle = `rgba(255,255,255,${0.08 * fa})`;
        ctx.stroke();
      }
      // Core line (thickens with age = ink spreading)
      ctx.lineWidth = Math.min(1.6 + age * 0.009, 18);
      ctx.strokeStyle = `rgba(255,255,255,${0.70 * fa})`;
      ctx.stroke();
    }
    else if (cur === 'dry'){
      const a = Math.max(0, 0.82 - age / 1800) * fa;
      if (a < 0.01) continue;
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y);
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = `rgba(255,255,255,${a})`;
      ctx.stroke();
    }
    else if (cur === 'rough'){
      if (p0.seed < 0.22) continue; // skip ~22% = broken line
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y);
      ctx.lineWidth = 1.2 + p0.seed * 1.9;
      ctx.strokeStyle = `rgba(255,255,255,${(0.42 + p0.seed * 0.38) * fa})`;
      ctx.stroke();
    }
  }
}

// ── Pen (スマホ = ペン) ────────────────────────────────────────────
function drawPen(al, sc){
  const R   = Math.min(W,H) * 0.028;
  const spd = Math.sqrt(bvx*bvx + bvy*bvy);
  // Pen oriented along movement; default resting angle when still
  const ang = spd > 0.3 ? Math.atan2(bvy, bvx) : -Math.PI * 0.28;

  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(ang);
  ctx.scale(sc, sc);
  ctx.globalAlpha = al;

  // Pen body: tapered shape — nib tip at origin, body extends backward
  const bL = R * 4.2; // body length
  const bW = R * 0.85; // body max width
  ctx.beginPath();
  ctx.moveTo(0, 0);                       // nib tip (front)
  ctx.lineTo(-R * 0.7, -bW * 0.32);
  ctx.lineTo(-bL,      -bW * 0.50);
  ctx.lineTo(-bL,       bW * 0.50);
  ctx.lineTo(-R * 0.7,  bW * 0.32);
  ctx.closePath();
  ctx.fillStyle = 'rgba(218,218,218,0.93)';
  ctx.fill();

  // Highlight along top edge
  ctx.beginPath();
  ctx.moveTo(-R * 0.9, -bW * 0.19);
  ctx.lineTo(-bL * 0.88, -bW * 0.25);
  ctx.lineWidth = R * 0.11;
  ctx.strokeStyle = 'rgba(255,255,255,0.38)';
  ctx.lineCap = 'round';
  ctx.stroke();

  // Nib tip — dark ink contact point
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.26, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(36,36,36,0.92)';
  ctx.fill();

  ctx.restore();
}

// ── Render ────────────────────────────────────────────────────────
function draw(now){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  // Trail fade multiplier
  let fa = 1;
  if (phase === 'fall') fa = Math.max(0, 1 - phaseT / FALL_MS);

  drawTrail(now, fa);

  // Pen scale / alpha
  let al, sc;
  if (phase === 'spawn'){
    const p = Math.min(phaseT / SPAWN_MS, 1);
    sc = eob(p); al = Math.min(p * 3, 1);
  } else if (phase === 'fall'){
    const p = Math.min(phaseT / FALL_MS, 1);
    sc = Math.max(0, 1 - p * 1.4); al = Math.max(0, 1 - p * 2.0);
  } else {
    sc = 1; al = 1;
  }
  if (al > 0.02 && sc > 0.01) drawPen(al, sc);
}

// ── Loop ─────────────────────────────────────────────────────────
let prevTs = 0;
function tick(ts){
  const dtMs = prevTs ? Math.min(ts - prevTs, 50) : 16.67;
  prevTs = ts;
  phaseT += dtMs;

  if (phase === 'spawn'){
    if (phaseT >= SPAWN_MS){ phase = 'active'; phaseT = 0; }
  } else if (phase === 'fall'){
    const dt = dtMs / 1000;
    bx += fallVx * dt * 2.5;
    by += fallVy * dt * 2.5;
    if (phaseT >= FALL_MS) spawnPen();
  } else {
    physics(dtMs);
    addPoint(ts);
  }

  draw(ts);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
