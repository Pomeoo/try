<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Surface Haptics</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#000; overflow:hidden; touch-action:none; }
canvas { position:fixed; inset:0; width:100%; height:100%; }

#lbl {
  position:fixed;
  top: calc(32px + env(safe-area-inset-top));
  left:0; right:0;
  text-align:center;
  font: 12px -apple-system, sans-serif;
  color: rgba(255,255,255,0.25);
  letter-spacing: .12em;
  pointer-events: none;
}

.ui {
  position:fixed; bottom:0; left:0; right:0;
  padding: 10px 12px calc(16px + env(safe-area-inset-bottom));
  background: linear-gradient(transparent, rgba(0,0,0,0.9) 45%);
}
.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.tab {
  padding: 11px 4px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.12);
  background: transparent;
  color: rgba(255,255,255,0.28);
  font: 11px -apple-system, sans-serif;
  letter-spacing: -.01em;
  cursor: pointer;
  transition: all .15s;
}
.tab.active {
  background: rgba(255,255,255,0.1);
  color: #fff;
  border-color: rgba(255,255,255,0.45);
}

#perm {
  position:fixed; top:50%; left:50%;
  transform: translate(-50%, -50%);
  padding: 16px 32px;
  border: 1px solid rgba(255,255,255,0.38);
  background: transparent; color: #fff;
  font: 15px -apple-system, sans-serif;
  border-radius: 100px;
  cursor: pointer;
  display: none;
}
#perm-sub {
  position:fixed; top: calc(50% + 56px); left:0; right:0;
  text-align:center;
  font: 11px -apple-system, sans-serif;
  color: rgba(255,255,255,0.22);
  display: none;
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="lbl">なめらか</div>
<div class="ui">
  <div class="tabs">
    <button class="tab active" data-s="smooth">なめらか</button>
    <button class="tab" data-s="ice">氷</button>
    <button class="tab" data-s="rubber">ゴム</button>
    <button class="tab" data-s="rough">ざらざら</button>
    <button class="tab" data-s="sand">砂紙</button>
    <button class="tab" data-s="sticky">粘着</button>
  </div>
</div>
<button id="perm">センサーを有効にする</button>
<p id="perm-sub">タップして傾きセンサーを許可</p>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;

function resize() {
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); spawnBall(); });

// Surface names
const NAMES = {
  smooth: 'なめらか',
  ice:    '氷',
  rubber: 'ゴム',
  rough:  'ざらざら',
  sand:   '砂紙',
  sticky: '粘着'
};

// Surface physics config
// fr: friction per frame, gv: gravity scale, vb: vibration, dm: deform, sk: sticky threshold
const CFG = {
  smooth: { fr:0.994,  gv:0.45, vb:0,   dm:0,    sk:0    },
  ice:    { fr:0.9988, gv:0.52, vb:0,   dm:0,    sk:0    },
  rubber: { fr:0.908,  gv:0.45, vb:0,   dm:0,    sk:0    },
  rough:  { fr:0.957,  gv:0.35, vb:1.4, dm:0.08, sk:0    },
  sand:   { fr:0.924,  gv:0.20, vb:3.0, dm:0.14, sk:0    },
  sticky: { fr:0.882,  gv:0.28, vb:0,   dm:0.32, sk:0.14 }
};

let cur = 'smooth', c = CFG.smooth;

// Ball state
let bx, by, bvx, bvy;
let tiltX = 0, tiltY = 0;

// Phase: 'active' | 'fall' | 'spawn'
let phase = 'spawn';
let phaseT = 0;
let fallVx = 0, fallVy = 0;

const FALL_DUR  = 400;
const SPAWN_DUR = 360;

function spawnBall() {
  bx = W / 2; by = H / 2;
  bvx = 0; bvy = 0;
  phase = 'spawn'; phaseT = 0;
}
spawnBall();

// Easing: easeOutBack (slight overshoot on spawn)
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

// Surface switching
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    cur = b.dataset.s;
    c = CFG[cur];
    document.getElementById('lbl').textContent = NAMES[cur];
    spawnBall();
  });
});

// Device orientation
function onOrientation(e) {
  if (e.gamma == null) return;
  tiltX = Math.max(-1, Math.min(1, e.gamma / 22));
  tiltY = Math.max(-1, Math.min(1, (e.beta - 30) / 22));
}
function setupOrientation() {
  window.addEventListener('deviceorientation', onOrientation);
}

const permBtn = document.getElementById('perm');
const permSub = document.getElementById('perm-sub');

if (typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission === 'function') {
  // iOS 13+
  permBtn.style.display = 'block';
  permSub.style.display = 'block';
  permBtn.addEventListener('click', async () => {
    try {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r === 'granted') {
        setupOrientation();
        permBtn.style.display = 'none';
        permSub.style.display = 'none';
      }
    } catch(e) {
      permBtn.textContent = '再度タップしてください';
    }
  });
} else {
  setupOrientation();
}

// Main loop
let prevT = 0;

function tick(t) {
  const dt  = prevT ? Math.min(t - prevT, 50) : 16.67;
  prevT = t;
  const R   = Math.min(W, H) * 0.053;
  const n   = dt / 16.67; // normalize to 60fps
  phaseT += dt;

  // ---- Physics update ----
  if (phase === 'spawn') {
    if (phaseT >= SPAWN_DUR) { phase = 'active'; phaseT = 0; }

  } else if (phase === 'fall') {
    bx += fallVx * n * 2.6;
    by += fallVy * n * 2.6;
    if (phaseT >= FALL_DUR) spawnBall();

  } else {
    // Active physics
    let ax = tiltX * c.gv;
    let ay = tiltY * c.gv;
    const sp = Math.sqrt(bvx * bvx + bvy * bvy);

    // Vibration for rough surfaces
    if (c.vb > 0 && sp > 0.1) {
      ax += (Math.random() - 0.5) * c.vb;
      ay += (Math.random() - 0.5) * c.vb;
    }

    // Sticky threshold: needs enough force to start moving
    if (c.sk > 0) {
      const f = Math.sqrt(ax * ax + ay * ay);
      if (sp < 0.4 && f < c.sk) { ax *= 0.03; ay *= 0.03; }
    }

    const fr = Math.pow(c.fr, n);
    bvx = (bvx + ax * n) * fr;
    bvy = (bvy + ay * n) * fr;
    bx += bvx * n;
    by += bvy * n;

    // Edge detection → trigger fall
    const edge = R * 0.35;
    if (bx < edge || bx > W - edge || by < edge || by > H - edge) {
      // Fall direction = away from center
      const dx = bx - W / 2, dy = by - H / 2;
      const d  = Math.sqrt(dx * dx + dy * dy) || 1;
      const minSpd = 2.5;
      fallVx = (dx / d) * Math.max(Math.abs(bvx), minSpd);
      fallVy = (dy / d) * Math.max(Math.abs(bvy), minSpd);
      phase = 'fall';
      phaseT = 0;
    }
  }

  // ---- Render ----
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Compute visual scale and alpha based on phase
  let al, sc;
  if (phase === 'spawn') {
    const p = Math.min(phaseT / SPAWN_DUR, 1);
    sc = easeOutBack(p);
    al = Math.min(p * 3, 1);
  } else if (phase === 'fall') {
    const p = Math.min(phaseT / FALL_DUR, 1);
    sc = Math.max(0, 1 - p * 1.4);
    al = Math.max(0, 1 - p * 2.0);
  } else {
    sc = 1; al = 1;
  }

  if (al < 0.02 || sc < 0.01) {
    requestAnimationFrame(tick);
    return;
  }

  const sp2 = Math.sqrt(bvx * bvx + bvy * bvy);

  // Shadow (subtle gray, offset)
  ctx.save();
  ctx.globalAlpha = al * 0.22;
  ctx.beginPath();
  ctx.arc(bx + 4 * sc, by + 5 * sc, R * 0.84 * sc, 0, Math.PI * 2);
  ctx.fillStyle = '#404040';
  ctx.fill();
  ctx.restore();

  // Ball
  ctx.save();
  ctx.translate(bx, by);
  ctx.globalAlpha = al;

  // Deformation along velocity axis (sticky/rough)
  let angle = 0, scX = sc, scY = sc;
  if (c.dm > 0 && sp2 > 1 && phase === 'active') {
    const stretch = 1 + sp2 * c.dm * 0.055;
    const squeeze = 1 / Math.sqrt(stretch);
    angle = Math.atan2(bvy, bvx);
    scX = stretch * sc;
    scY = squeeze * sc;
  }
  ctx.rotate(angle);
  ctx.scale(scX, scY);

  // Ball body — radial gradient (monochrome)
  const g = ctx.createRadialGradient(-R * 0.22, -R * 0.28, 1, 0, 0, R);
  g.addColorStop(0,   '#ffffff');
  g.addColorStop(0.6, '#c0c0c0');
  g.addColorStop(1,   '#555555');
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();

  // Specular highlight
  ctx.beginPath();
  ctx.arc(-R * 0.27, -R * 0.31, R * 0.20, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.44)';
  ctx.fill();

  ctx.restore();

  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);
</script>
</body>
</html>
