<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Surface Haptics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#lbl{
  position:fixed;
  top:calc(30px + env(safe-area-inset-top));
  left:0;right:0;text-align:center;
  font:12px -apple-system,sans-serif;
  color:rgba(255,255,255,.20);
  letter-spacing:.12em;pointer-events:none;
}
.ui{
  position:fixed;bottom:0;left:0;right:0;
  padding:10px 12px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(0,0,0,.92) 40%);
}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{
  padding:11px 4px;border-radius:10px;
  border:1px solid rgba(255,255,255,.12);
  background:transparent;color:rgba(255,255,255,.28);
  font:11px -apple-system,sans-serif;cursor:pointer;transition:all .15s;
}
.tab.active{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.45)}
#perm{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  padding:16px 32px;
  border:1px solid rgba(255,255,255,.38);
  background:transparent;color:#fff;
  font:15px -apple-system,sans-serif;
  border-radius:100px;cursor:pointer;display:none;
}
#perm-sub{
  position:fixed;top:calc(50% + 54px);
  left:0;right:0;text-align:center;
  font:11px -apple-system,sans-serif;
  color:rgba(255,255,255,.2);display:none;
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="lbl">なめらか</div>
<div class="ui">
  <div class="tabs">
    <button class="tab active" data-s="smooth">なめらか</button>
    <button class="tab"        data-s="ice">氷</button>
    <button class="tab"        data-s="rough">ざらざら</button>
    <button class="tab"        data-s="sticky">粘着</button>
  </div>
</div>
<button id="perm">センサーを有効にする</button>
<p id="perm-sub">タップして傾きセンサーを許可</p>

<script>
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;
function resize(){ W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
resize();
window.addEventListener('resize', () => { resize(); spawnBall(); });

// ── Physical constants ──────────────────────────────────────────────
const G        = 9.8;    // gravity [m/s²]
const SCREEN_W = 0.070;  // assumed phone screen width [m] = 70mm

// Real-world friction coefficients
// mu_s = static (holds ball still), mu_k = kinetic (opposes sliding)
// Angle of repose = arctan(mu_s):
//   smooth  → 8.5°  (polished wood or glass)
//   ice     → 2.3°  (ice on ice)
//   rough   → 24.2° (concrete / coarse board)
//   sticky  → 36.9° (rubber / adhesive surface)
const CFG = {
  smooth: { name:'なめらか', mu_s:0.15, mu_k:0.10, vib:0,   dm:0    },
  ice:    { name:'氷',       mu_s:0.04, mu_k:0.03, vib:0,   dm:0    },
  rough:  { name:'ざらざら', mu_s:0.45, mu_k:0.35, vib:1.0, dm:0.06 },
  sticky: { name:'粘着',     mu_s:0.75, mu_k:0.55, vib:0,   dm:0.30 }
};

let cur = 'smooth', c = CFG.smooth;

// Ball state [px, px/s]
let bx, by, bvx, bvy;

// Tilt = sin(tilt angle) in screen x/y  [-1, 1]
// Derived from device orientation so the in-phone world matches the real world:
//   tiltX = sin(gamma)       — left/right lean
//   tiltY = sin(beta − 90°)  — forward/back lean  (0 when holding upright)
let tiltX = 0, tiltY = 0;

// State machine
let phase  = 'spawn'; // 'active' | 'fall' | 'spawn'
let phaseT = 0;
let fallVx = 0, fallVy = 0;
const FALL_MS  = 420;
const SPAWN_MS = 380;

function spawnBall(){
  bx = W/2; by = H/2; bvx = 0; bvy = 0;
  phase = 'spawn'; phaseT = 0;
}
spawnBall();

// Easing: easeOutBack (subtle overshoot on spawn)
function eob(t){ const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }

// Surface switching
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    cur = b.dataset.s; c = CFG[cur];
    document.getElementById('lbl').textContent = c.name;
    spawnBall();
  });
});

// ── Sensor ──────────────────────────────────────────────────────────
function onOri(e){
  if (e.gamma == null) return;
  // Map real tilt angles to gravity components in the screen plane.
  // This keeps the virtual world consistent with the physical world:
  // the ball behaves as if gravity is literally pulling it on the phone's surface.
  tiltX = Math.sin(e.gamma       * Math.PI / 180);
  tiltY = Math.sin((e.beta - 90) * Math.PI / 180);
}
function setupOri(){ window.addEventListener('deviceorientation', onOri); }

const pb = document.getElementById('perm');
const ps = document.getElementById('perm-sub');
if (typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission === 'function') {
  pb.style.display = 'block'; ps.style.display = 'block';
  pb.addEventListener('click', async () => {
    try {
      if (await DeviceOrientationEvent.requestPermission() === 'granted'){
        setupOri(); pb.style.display = 'none'; ps.style.display = 'none';
      }
    } catch(e){ pb.textContent = '再度タップ'; }
  });
} else {
  setupOri();
}

// ── Physics ─────────────────────────────────────────────────────────
function physics(dt){
  const ppm  = W / SCREEN_W;        // px per metre
  const gPx  = G * ppm;             // gravity [px/s²]

  // Gravity force components in screen space
  const gravX   = tiltX * gPx;
  const gravY   = tiltY * gPx;
  const gravMag = Math.sqrt(gravX*gravX + gravY*gravY);

  const spd = Math.sqrt(bvx*bvx + bvy*bvy);

  // ── Static friction ────────────────────────────────────────────
  // Ball stays still if driving force is below static threshold
  if (spd < ppm * 0.008 && gravMag < c.mu_s * gPx){
    bvx = 0; bvy = 0;
    return;
  }

  // ── Kinetic friction ───────────────────────────────────────────
  // Friction force opposes current velocity direction
  let frX = 0, frY = 0;
  if (spd > 0){
    const fMag = c.mu_k * gPx;
    frX = -(bvx/spd) * fMag;
    frY = -(bvy/spd) * fMag;
  }

  // ── Micro-vibration (stick-slip on rough surfaces) ─────────────
  // Models the irregular micro-contacts of a rough texture:
  // the ball alternately sticks and slips, causing small random jolts
  let vbX = 0, vbY = 0;
  if (c.vib > 0 && spd > ppm * 0.015){
    const vbMag = c.vib * (c.mu_k * gPx) * 0.14;
    vbX = (Math.random() - 0.5) * vbMag;
    vbY = (Math.random() - 0.5) * vbMag;
  }

  // ── Integrate ──────────────────────────────────────────────────
  const ax = gravX + frX + vbX;
  const ay = gravY + frY + vbY;

  const pvx = bvx, pvy = bvy;
  bvx += ax * dt;
  bvy += ay * dt;

  // Friction must not reverse velocity — if dot product flipped, ball stopped
  if (pvx*bvx + pvy*bvy < 0){ bvx = 0; bvy = 0; }

  bx += bvx * dt;
  by += bvy * dt;

  // ── Edge: ball falls off ───────────────────────────────────────
  const R2 = Math.min(W,H) * 0.052 * 0.4;
  if (bx < R2 || bx > W-R2 || by < R2 || by > H-R2){
    const dx = bx-W/2, dy = by-H/2, d = Math.sqrt(dx*dx+dy*dy)||1;
    const minV = ppm * 0.25;
    fallVx = (dx/d) * Math.max(Math.abs(bvx), minV);
    fallVy = (dy/d) * Math.max(Math.abs(bvy), minV);
    phase = 'fall'; phaseT = 0;
  }
}

// ── Render ──────────────────────────────────────────────────────────
function draw(){
  const R   = Math.min(W,H) * 0.052;
  const ppm = W / SCREEN_W;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  // Visual scale & alpha per phase
  let al, sc;
  if (phase === 'spawn'){
    const p = Math.min(phaseT/SPAWN_MS, 1);
    sc = eob(p); al = Math.min(p*3, 1);
  } else if (phase === 'fall'){
    const p = Math.min(phaseT/FALL_MS, 1);
    sc = Math.max(0, 1-p*1.4); al = Math.max(0, 1-p*2.0);
  } else {
    sc = 1; al = 1;
  }
  if (al < 0.02 || sc < 0.01) return;

  const spd = Math.sqrt(bvx*bvx + bvy*bvy);

  // Shadow (subtle gray offset — visible against black)
  ctx.save();
  ctx.globalAlpha = al * 0.20;
  ctx.beginPath();
  ctx.arc(bx + 4*sc, by + 5*sc, R*0.82*sc, 0, Math.PI*2);
  ctx.fillStyle = '#404040';
  ctx.fill();
  ctx.restore();

  // Ball
  ctx.save();
  ctx.translate(bx, by);
  ctx.globalAlpha = al;

  // Deformation: ball stretches along velocity axis (sticky/rough)
  // Scale is physical: speedMS in m/s drives deformation amount
  let ang = 0, scX = sc, scY = sc;
  if (c.dm > 0 && spd > ppm*0.04 && phase === 'active'){
    const speedMS = spd / ppm;
    const str = 1 + speedMS * c.dm;
    const sqz = 1 / Math.sqrt(str);
    ang = Math.atan2(bvy, bvx);
    scX = str*sc; scY = sqz*sc;
  }
  ctx.rotate(ang);
  ctx.scale(scX, scY);

  // Monochrome radial gradient
  const g = ctx.createRadialGradient(-R*0.22, -R*0.28, 1, 0, 0, R);
  g.addColorStop(0,   '#ffffff');
  g.addColorStop(0.6, '#c0c0c0');
  g.addColorStop(1,   '#555555');
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI*2);
  ctx.fillStyle = g;
  ctx.fill();

  // Specular highlight
  ctx.beginPath();
  ctx.arc(-R*0.27, -R*0.31, R*0.20, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.44)';
  ctx.fill();

  ctx.restore();
}

// ── Main loop ────────────────────────────────────────────────────────
let prevTs = 0;
function tick(ts){
  const dtMs = prevTs ? Math.min(ts - prevTs, 50) : 16.67;
  prevTs = ts;
  const dt = dtMs / 1000; // seconds
  phaseT += dtMs;

  if (phase === 'spawn'){
    if (phaseT >= SPAWN_MS){ phase = 'active'; phaseT = 0; }
  } else if (phase === 'fall'){
    bx += fallVx * dt * 2.5;
    by += fallVy * dt * 2.5;
    if (phaseT >= FALL_MS) spawnBall();
  } else {
    physics(dt);
  }

  draw();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
