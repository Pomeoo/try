<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Visual Haptics</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#111; font-family:-apple-system,sans-serif; }

#surface-canvas {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  touch-action:none;
}

/* プローブ（棒）*/
#probe {
  position:fixed;
  left:50%;
  top:0;
  width:2px;
  transform:translateX(-50%);
  pointer-events:none;
  z-index:20;
  transition: left 0.05s ease-out;
}
#probe-shaft {
  width:2px;
  background: linear-gradient(180deg, transparent 0%, rgba(200,200,180,0.3) 20%, rgba(220,215,200,0.85) 60%, #e8e4d8 100%);
}
#probe-tip {
  width:10px; height:10px;
  border-radius:50%;
  background:#f0ece0;
  margin-left:-4px;
  box-shadow:0 0 0 2px rgba(255,255,240,0.4);
  transition: transform 0.06s, box-shadow 0.06s;
}

/* 接触エフェクト */
#contact-ring {
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  z-index:18;
  transform:translate(-50%,-50%);
}

/* テクスチャ切り替えUI */
#texture-tabs {
  position:fixed;
  bottom:0; left:0; right:0;
  height:52px;
  display:flex;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
  border-top:1px solid rgba(255,255,255,0.08);
  z-index:30;
}
.ttab {
  flex:1;
  border:none;
  background:transparent;
  color:rgba(255,255,255,0.4);
  font-size:11px;
  cursor:pointer;
  padding:4px 0 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  transition:color 0.15s;
}
.ttab .dot {
  width:8px; height:8px;
  border-radius:50%;
  background:currentColor;
  opacity:0.5;
}
.ttab.active {
  color:#f0ece0;
}
.ttab.active .dot { opacity:1; }

/* センサーボタン */
#sens-btn {
  position:fixed;
  top:14px; right:14px;
  padding:6px 12px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:20px;
  color:rgba(255,255,255,0.5);
  font-size:11px;
  cursor:pointer;
  z-index:30;
  transition:all 0.2s;
}
#sens-btn.on {
  color:#7fdb9e;
  border-color:rgba(127,219,158,0.4);
  background:rgba(127,219,158,0.08);
}

/* 質感ラベル */
#tex-label {
  position:fixed;
  top:14px; left:14px;
  color:rgba(255,255,255,0.35);
  font-size:11px;
  letter-spacing:0.08em;
  z-index:30;
  pointer-events:none;
  text-transform:uppercase;
}
</style>
</head>
<body>

<canvas id="surface-canvas"></canvas>

<div id="probe">
  <div id="probe-shaft"></div>
  <div id="probe-tip"></div>
</div>

<canvas id="contact-ring" width="120" height="120" style="width:120px;height:120px;"></canvas>

<div id="tex-label">Smooth</div>

<button id="sens-btn" onclick="requestSensor()">センサー有効化</button>

<div id="texture-tabs">
  <button class="ttab active" onclick="setTexture(0)"><span class="dot"></span>Smooth</button>
  <button class="ttab" onclick="setTexture(1)"><span class="dot"></span>Sand</button>
  <button class="ttab" onclick="setTexture(2)"><span class="dot"></span>Grain</button>
  <button class="ttab" onclick="setTexture(3)"><span class="dot"></span>Bumpy</button>
  <button class="ttab" onclick="setTexture(4)"><span class="dot"></span>Rough</button>
</div>

<script>
const surfCv = document.getElementById('surface-canvas');
const sCtx = surfCv.getContext('2d');
const contactCv = document.getElementById('contact-ring');
const cCtx = contactCv.getContext('2d');
const probe = document.getElementById('probe');
const probeShaft = document.getElementById('probe-shaft');
const probeTip = document.getElementById('probe-tip');
const texLabel = document.getElementById('tex-label');

// ---- State ----
let W = 0, H = 0;
let probeX = 0.5; // 0-1 normalized
let probeY = 0;   // surface contact Y (fixed at surface level)
let surfaceY = 0; // Y where probe meets surface
let sensorOn = false;

let rawAccelX = 0, smoothAccelX = 0;
let velX = 0, posX = 0.5; // integrated position

let currentTexture = 0;
const TEXTURES = ['Smooth','Sand','Grain','Bumpy','Rough'];

// Probe振動状態
let vibX = 0, vibY = 0;
let vibVX = 0, vibVY = 0;
let probeSpeed = 0;
let lastPosX = 0.5;

// contact ring animation
let ringFrames = [];

// ---- Resize ----
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  surfCv.width = W;
  surfCv.height = H;
  surfaceY = H * 0.52; // 画面中央やや下が接触面
  probeShaft.style.height = surfaceY + 'px';
  probe.style.top = '0px';
  drawSurface();
}
resize();
window.addEventListener('resize', resize);

// ---- Surface rendering ----
function drawSurface() {
  sCtx.clearRect(0, 0, W, H);

  // 表面テクスチャゾーン（画面全体）
  const tx = currentTexture;

  // 背景（表面）
  const surfGrad = sCtx.createLinearGradient(0, surfaceY - 40, 0, surfaceY + 80);
  surfGrad.addColorStop(0, 'rgba(255,255,255,0)');
  surfGrad.addColorStop(0.3, texColors[tx][0]);
  surfGrad.addColorStop(1, texColors[tx][1]);
  sCtx.fillStyle = surfGrad;
  sCtx.fillRect(0, surfaceY - 40, W, H);

  // テクスチャパターン描画
  drawTexturePattern(tx, surfaceY);

  // 表面ラインのハイライト
  sCtx.beginPath();
  sCtx.moveTo(0, surfaceY);
  sCtx.lineTo(W, surfaceY);
  sCtx.strokeStyle = texColors[tx][2];
  sCtx.lineWidth = 1;
  sCtx.stroke();
}

const texColors = [
  // Smooth
  ['rgba(180,190,200,0.25)','rgba(100,110,130,0.6)','rgba(220,225,235,0.6)'],
  // Sand
  ['rgba(200,175,130,0.3)','rgba(150,120,80,0.65)','rgba(220,200,155,0.6)'],
  // Grain
  ['rgba(160,140,110,0.3)','rgba(100,80,55,0.65)','rgba(200,180,140,0.6)'],
  // Bumpy
  ['rgba(140,160,140,0.25)','rgba(80,100,80,0.6)','rgba(180,200,175,0.55)'],
  // Rough
  ['rgba(160,140,140,0.3)','rgba(100,80,80,0.65)','rgba(200,175,170,0.6)'],
];

function drawTexturePattern(tx, sy) {
  sCtx.save();
  sCtx.globalAlpha = 0.35;

  if (tx === 0) { // Smooth: 細かい水平ライン
    for (let y = sy; y < H; y += 6) {
      sCtx.beginPath();
      sCtx.moveTo(0, y);
      sCtx.lineTo(W, y);
      sCtx.strokeStyle = 'rgba(255,255,255,0.12)';
      sCtx.lineWidth = 0.5;
      sCtx.stroke();
    }
  } else if (tx === 1) { // Sand: ランダム粒
    for (let i = 0; i < 400; i++) {
      const x = Math.random() * W;
      const y = sy + Math.random() * (H - sy);
      const r = 0.5 + Math.random() * 1.5;
      sCtx.beginPath();
      sCtx.arc(x, y, r, 0, Math.PI * 2);
      sCtx.fillStyle = `rgba(${200 + Math.random()*30|0},${170+Math.random()*20|0},${120+Math.random()*20|0},0.5)`;
      sCtx.fill();
    }
  } else if (tx === 2) { // Grain: 木目
    for (let i = 0; i < 12; i++) {
      const yBase = sy + (H - sy) * (i / 12);
      sCtx.beginPath();
      sCtx.moveTo(0, yBase);
      for (let x = 0; x < W; x += 8) {
        sCtx.lineTo(x, yBase + Math.sin(x * 0.04 + i) * 4);
      }
      sCtx.strokeStyle = 'rgba(180,140,90,0.2)';
      sCtx.lineWidth = 1.5;
      sCtx.stroke();
    }
  } else if (tx === 3) { // Bumpy: 半球列
    for (let y = sy + 14; y < H; y += 22) {
      for (let x = 10; x < W; x += 20) {
        const rad = sCtx.createRadialGradient(x, y, 0, x, y, 9);
        rad.addColorStop(0, 'rgba(255,255,255,0.3)');
        rad.addColorStop(0.5, 'rgba(150,175,150,0.1)');
        rad.addColorStop(1, 'rgba(0,0,0,0)');
        sCtx.beginPath();
        sCtx.arc(x, y, 9, 0, Math.PI * 2);
        sCtx.fillStyle = rad;
        sCtx.fill();
      }
    }
  } else if (tx === 4) { // Rough: 不規則クラック
    for (let i = 0; i < 30; i++) {
      const x0 = Math.random() * W;
      const y0 = sy + Math.random() * (H - sy);
      sCtx.beginPath();
      sCtx.moveTo(x0, y0);
      let cx = x0, cy = y0;
      for (let s = 0; s < 4; s++) {
        cx += (Math.random() - 0.5) * 30;
        cy += Math.random() * 15;
        sCtx.lineTo(cx, cy);
      }
      sCtx.strokeStyle = 'rgba(80,60,60,0.3)';
      sCtx.lineWidth = 0.8;
      sCtx.stroke();
    }
  }
  sCtx.restore();
}

// ---- Texture reaction ----
// 各テクスチャの振動特性
const texProps = [
  { freq: 0.8, amp: 0.6, damp: 0.82, scatter: 0.3,  ringStyle: 'concentric' }, // Smooth
  { freq: 1.8, amp: 2.2, damp: 0.70, scatter: 2.0,  ringStyle: 'scatter'    }, // Sand
  { freq: 1.2, amp: 1.5, damp: 0.75, scatter: 1.0,  ringStyle: 'lines'      }, // Grain
  { freq: 2.5, amp: 3.5, damp: 0.65, scatter: 1.5,  ringStyle: 'pulse'      }, // Bumpy
  { freq: 3.0, amp: 5.0, damp: 0.55, scatter: 3.0,  ringStyle: 'burst'      }, // Rough
];

// ---- Contact ring canvas ----
function drawContactEffect(px, py, speed, tx) {
  cCtx.clearRect(0, 0, 120, 120);
  const p = texProps[tx];
  const intensity = Math.min(1, speed * 0.12 + 0.1);
  const cx = 60, cy = 60;

  if (p.ringStyle === 'concentric') {
    for (let i = 1; i <= 3; i++) {
      const r = 8 + i * 12 * intensity;
      cCtx.beginPath();
      cCtx.arc(cx, cy, r, 0, Math.PI * 2);
      cCtx.strokeStyle = `rgba(210,215,225,${0.4 * intensity / i})`;
      cCtx.lineWidth = 0.8;
      cCtx.stroke();
    }

  } else if (p.ringStyle === 'scatter') {
    const n = Math.floor(8 + intensity * 18);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = (8 + Math.random() * 24) * intensity;
      const px2 = cx + Math.cos(a) * r;
      const py2 = cy + Math.sin(a) * r;
      cCtx.beginPath();
      cCtx.arc(px2, py2, 0.5 + Math.random() * 1.5, 0, Math.PI * 2);
      cCtx.fillStyle = `rgba(210,185,140,${0.5 * intensity})`;
      cCtx.fill();
    }

  } else if (p.ringStyle === 'lines') {
    for (let i = -3; i <= 3; i++) {
      const y2 = cy + i * 6 * intensity;
      const w = (24 - Math.abs(i) * 3) * intensity;
      cCtx.beginPath();
      cCtx.moveTo(cx - w, y2);
      cCtx.lineTo(cx + w, y2);
      cCtx.strokeStyle = `rgba(195,165,115,${0.4 * intensity / (Math.abs(i) + 1)})`;
      cCtx.lineWidth = 1;
      cCtx.stroke();
    }

  } else if (p.ringStyle === 'pulse') {
    const phase = Date.now() * 0.008;
    for (let i = 0; i < 5; i++) {
      const r = (6 + i * 9 + Math.sin(phase + i) * 3) * intensity;
      cCtx.beginPath();
      cCtx.arc(cx, cy, r, 0, Math.PI * 2);
      cCtx.strokeStyle = `rgba(175,200,170,${0.35 * intensity / (i + 1)})`;
      cCtx.lineWidth = 1.2;
      cCtx.stroke();
    }

  } else if (p.ringStyle === 'burst') {
    const n = Math.floor(6 + intensity * 8);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + vibX * 0.5;
      const r1 = 6 * intensity;
      const r2 = (12 + Math.random() * 20) * intensity;
      cCtx.beginPath();
      cCtx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      cCtx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
      cCtx.strokeStyle = `rgba(200,170,165,${0.5 * intensity})`;
      cCtx.lineWidth = 0.8;
      cCtx.stroke();
    }
  }

  // 先端マーク
  cCtx.beginPath();
  cCtx.arc(cx, cy, 3, 0, Math.PI * 2);
  cCtx.fillStyle = `rgba(255,252,240,${0.6 + intensity * 0.3})`;
  cCtx.fill();

  // position contact ring
  const el = document.getElementById('contact-ring');
  el.style.left = (px - 60) + 'px';
  el.style.top  = (py - 60) + 'px';
}

// ---- Probe vibration physics ----
function updateProbeVibration(speed, tx) {
  const p = texProps[tx];
  const force = speed * p.amp;

  // 各テクスチャ固有のランダム外力
  const noise = (Math.random() - 0.5) * force * p.scatter;
  vibVX += noise;
  vibVY += (Math.random() - 0.5) * force * p.scatter * 0.4;
  // 減衰バネ
  vibVX = (vibVX - vibX * p.freq) * p.damp;
  vibVY = (vibVY - vibY * p.freq * 0.5) * p.damp;
  vibX += vibVX;
  vibY += vibVY;

  // プローブ先端にオフセット反映
  probeTip.style.transform = `translate(${vibX * 0.5}px, ${vibY * 0.3}px)`;

  // 強度によるグロー
  const glow = Math.min(18, speed * 2.5 + 4);
  probeTip.style.boxShadow = `0 0 ${glow}px ${glow*0.4}px rgba(255,252,220,${Math.min(0.9, speed * 0.15 + 0.2)})`;
}

// ---- Animation loop ----
let frame = 0;
function loop() {
  requestAnimationFrame(loop);
  frame++;

  // センサーOFFのときはマウス位置（デスクトップ）のみ
  if (!sensorOn) {
    // posXはmousemoveで更新
  } else {
    // 加速度を積分してposX更新
    velX += smoothAccelX * 0.008;
    velX *= 0.90; // 摩擦
    posX += velX;
    posX = Math.max(0.05, Math.min(0.95, posX));
  }

  const px = posX * W;
  const py = surfaceY;

  // プローブ位置更新
  probe.style.left = px + 'px';

  // 速度計算
  const dx = posX - lastPosX;
  probeSpeed = Math.abs(dx) * W * 0.5;
  lastPosX = posX;

  // 振動
  if (probeSpeed > 0.01 || Math.abs(vibX) > 0.1) {
    updateProbeVibration(probeSpeed, currentTexture);
  }

  // コンタクトエフェクト
  if (frame % 2 === 0) {
    drawContactEffect(px, py, probeSpeed, currentTexture);
  }

  // 表面テクスチャの動的更新（Bumpy/Roughはアニメーション）
  if ((currentTexture === 3 || currentTexture === 4) && frame % 4 === 0) {
    drawSurface();
  }
}
loop();

// ---- Texture select ----
function setTexture(i) {
  currentTexture = i;
  texLabel.textContent = TEXTURES[i];
  document.querySelectorAll('.ttab').forEach((t, j) => {
    t.className = 'ttab' + (j === i ? ' active' : '');
  });
  drawSurface();
  // reset vibration
  vibX = vibY = vibVX = vibVY = 0;
}

// ---- Sensor ----
function requestSensor() {
  const btn = document.getElementById('sens-btn');
  const start = () => {
    sensorOn = true;
    btn.textContent = 'センサー ON';
    btn.className = 'on';
    window.addEventListener('devicemotion', e => {
      const raw = (e.acceleration && e.acceleration.x != null)
        ? e.acceleration.x
        : (e.accelerationIncludingGravity ? e.accelerationIncludingGravity.x : 0);
      rawAccelX = (raw || 0);
      smoothAccelX = smoothAccelX * 0.65 + rawAccelX * 0.35;
    });
  };
  if (typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission().then(s => {
      if (s === 'granted') start();
      else btn.textContent = '許可が必要';
    }).catch(() => btn.textContent = 'エラー');
  } else if (window.DeviceMotionEvent) {
    start();
  } else {
    btn.textContent = '非対応（マウスで代用）';
  }
}

// ---- Mouse/Touch fallback ----
document.addEventListener('mousemove', e => {
  if (!sensorOn) {
    posX = e.clientX / W;
  }
});

document.addEventListener('touchmove', e => {
  if (!sensorOn) {
    posX = e.touches[0].clientX / W;
  }
}, { passive: true });
</script>
</body>
</html>
